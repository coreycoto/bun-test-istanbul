name: GitHub Releases
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Reviewed source ref to package
        required: true
        default: main
  release:
    types: [published]
permissions:
  contents: read
jobs:
  draft:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Prepare and test exact release assets
        run: bun run release:prepare --out-dir="$RUNNER_TEMP/release-assets"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$(bun -e 'console.log("v" + (await Bun.file("package.json").json()).version)')"
          release_sha="$(git rev-parse HEAD)"
          package_file="$(bun -e 'console.log("bun-test-istanbul-" + (await Bun.file("package.json").json()).version + ".tgz")')"
          flags=()
          if [[ "$release_tag" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$release_tag" \
            "$RUNNER_TEMP/release-assets/$package_file" \
            "$RUNNER_TEMP/release-assets/release.json" \
            "$RUNNER_TEMP/release-assets/SHA256SUMS" \
            --target "$release_sha" --draft "${flags[@]}" \
            --title "bun-test-istanbul $release_tag" --notes-file CHANGELOG.md
          gh release download "$release_tag" --dir "$RUNNER_TEMP/downloaded-assets"
      - name: Verify downloaded draft assets and installed consumer
        run: bun run release:verify --assets-dir="$RUNNER_TEMP/downloaded-assets"
  verify-public:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Verify anonymous release downloads and URL installation
        run: bun run release:verify
